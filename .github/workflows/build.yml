name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS
            args: --target universal-apple-darwin
          - platform: windows-latest
            name: Windows
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Keep line endings exactly as they are
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Find the project folder
        id: proj
        shell: bash
        run: |
          conf=$(git ls-files | grep -E '(^|/)src-tauri/tauri\.conf\.json$' | head -1)
          if [ -z "$conf" ]; then
            echo "::error::Couldn't find src-tauri/tauri.conf.json in the repository. Upload the src-tauri folder too."
            exit 1
          fi
          dir=$(dirname "$(dirname "$conf")")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ steps.proj.outputs.dir }}/src-tauri -> target"

      - name: Install
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm install

      - name: Test the editor
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm test

      - name: Build
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ${{ steps.proj.outputs.dir }}
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Dante Preset Editor ${{ github.ref_name }}"
          releaseDraft: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Dante-Preset-Editor-${{ matrix.name }}
          path: |
            ${{ steps.proj.outputs.dir }}/src-tauri/target/**/release/bundle/dmg/*.dmg
            ${{ steps.proj.outputs.dir }}/src-tauri/target/**/release/bundle/nsis/*.exe
            ${{ steps.proj.outputs.dir }}/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
