name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS
            args: --target universal-apple-darwin
          - platform: windows-latest
            name: Windows
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Keep line endings exactly as they are
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Find the project folder
        id: proj
        shell: bash
        run: |
          conf=$(git ls-files | grep -E '(^|/)src-tauri/tauri\.conf\.json$' | head -1)
          if [ -z "$conf" ]; then
            echo "::error::Couldn't find src-tauri/tauri.conf.json in the repository. Upload the src-tauri folder too."
            exit 1
          fi
          dir=$(dirname "$(dirname "$conf")")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ steps.proj.outputs.dir }}/src-tauri -> target"

      - name: Install
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm install

      - name: Test the editor
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm test

      - name: Build
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ${{ steps.proj.outputs.dir }}
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Offline Preset Editor for Dante ${{ github.ref_name }}"
          releaseDraft: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Preset-Editor-for-Dante-${{ matrix.name }}
          path: |
            ${{ steps.proj.outputs.dir }}/src-tauri/target/**/release/bundle/dmg/*.dmg
            ${{ steps.proj.outputs.dir }}/src-tauri/target/**/release/bundle/nsis/*.exe
            ${{ steps.proj.outputs.dir }}/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error

      # Plain, fixed file names so the README can link straight to a download:
      #   .../releases/latest/download/Offline-Preset-Editor-for-Dante-macOS.dmg
      - name: Attach fixed-name downloads to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ steps.proj.outputs.dir }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dl
          T="$DIR/src-tauri/target"
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp "$(find "$T" -path '*bundle/dmg/*.dmg' | head -1)" dl/Offline-Preset-Editor-for-Dante-macOS.dmg
          else
            cp "$(find "$T" -path '*bundle/nsis/*.exe' | head -1)" dl/Offline-Preset-Editor-for-Dante-Windows-setup.exe
            # single portable exe (needs WebView2, which Windows 10/11 already have)
            cp "$(find "$T" -path '*release/dante-preset-editor.exe' | head -1)" dl/Offline-Preset-Editor-for-Dante-Windows-portable.exe
          fi
          gh release upload "$TAG" dl/* --clobber
